name: Release

# Release flow:
#   scripts/release.ps1  ->  bump VERSION + package.json, tag v<semver>, push
#   tag push             ->  this workflow: gates, bootstrap build, GitHub Release
#
# There is no per-release installer. Marvi is installed and updated by the
# bootstrap (apps/updater), which clones the tag and builds it on the machine.
# So the release artifact is the bootstrap binary plus checksums, and the tag
# itself is the payload.
#
# That makes the gates the important part of this file. A tag that cannot be
# built is a tag that breaks every Dev-channel update, and the failure lands on
# the user's machine rather than here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the dry-run build (no release is created)'
        required: false
        default: 'dry-run'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (full history for tags + notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and guard tag/VERSION agreement
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            FILE_VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
            if [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Tag $TAG does not match VERSION file ($FILE_VERSION). Refusing to release."
              exit 1
            fi
            DRY_RUN="false"
          else
            VERSION="${{ inputs.version }}"
            DRY_RUN="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Releasing version=$VERSION dry_run=$DRY_RUN"

      - name: Verify the release tag is signed
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Re-fetch the tag *object*. actions/checkout leaves the ref pointing
          # straight at the commit, so verify-tag reported "cannot verify a
          # non-tag object of type commit" for a tag that was annotated and
          # correctly signed on the remote. That false failure rejected a good
          # v0.3.3.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is lightweight. A release tag must be annotated and signed."
            exit 1
          fi
          # Every tag through v0.3.2 was unsigned: commit.gpgsign was set,
          # tag.gpgsign was not, and `git tag -a` does not sign.
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          if ! git verify-tag "$TAG"; then
            echo "::error::$TAG is not signed by a key in .github/allowed_signers."
            exit 1
          fi
          echo "$TAG is signed by a trusted key"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # -- gates ------------------------------------------------------------
      # Everything a user's machine would run, run here first. The build gate
      # in particular: the updater runs `build:unpack` on the tag, so a tag
      # that fails it is a tag that bricks every update.

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Desktop tests
        run: npm test

      - name: Install the browser engine
        # Browser tools cannot open a page without it, and the browser test is
        # one of the few that exercises a real page. This is the same install
        # `marvi setup browser` performs.
        run: uv run --project services/gateway playwright install chromium

      - name: Gateway tests
        run: uv run --project services/gateway pytest -q services/gateway/tests

      - name: Gateway lint
        run: uv run --project services/gateway ruff check .

      - name: Agent tests
        run: uv run --project services/agent pytest -q services/agent/tests

      - name: Bootstrap tests
        working-directory: apps/updater
        run: cargo test --workspace

      - name: Guard the provisioned Node against the one CI builds with
        shell: bash
        run: |
          # v0.2.0 provisioned v22.11.0 and could not build the app, while CI
          # built it fine on whatever `node-version: 22` resolved to. The build
          # a release is gated on has to be the build a user gets.
          PINNED="$(grep -m1 'pub const NODE_VERSION' apps/updater/crates/core/src/install.rs \
            | cut -d'"' -f2)"
          PINNED_MAJOR="${PINNED#v}"; PINNED_MAJOR="${PINNED_MAJOR%%.*}"
          CI_MAJOR="$(node --version)"; CI_MAJOR="${CI_MAJOR#v}"; CI_MAJOR="${CI_MAJOR%%.*}"
          if [ "$PINNED_MAJOR" != "$CI_MAJOR" ]; then
            echo "::error::the installer provisions Node $PINNED but CI builds on v$CI_MAJOR.x"
            exit 1
          fi
          echo "installer provisions $PINNED; CI is on v$CI_MAJOR.x"

      - name: Guard bootstrap/VERSION agreement
        shell: bash
        run: |
          # The bootstrap ships as its own binary and is the thing that performs
          # updates, so a user can be holding an older one than the release they
          # installed. `marvi-bootstrap --version` is how they find out, which
          # only helps if the number is the product's.
          BOOTSTRAP="$(grep -m1 '^version = ' apps/updater/Cargo.toml | cut -d'"' -f2)"
          FILE_VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
          if [ "$BOOTSTRAP" != "$FILE_VERSION" ]; then
            echo "::error::apps/updater/Cargo.toml is $BOOTSTRAP but VERSION is $FILE_VERSION."
            exit 1
          fi
          echo "bootstrap version $BOOTSTRAP matches VERSION"

      - name: Provision the toolchain for real
        working-directory: apps/updater
        # The `uv` installer was broken from the day it was written and shipped
        # that way, because it only runs on a machine without `uv` and every
        # machine that built Marvi had it. This is the test that would have
        # caught it, so it runs on the release path even though it downloads.
        run: cargo test --test toolchain_live -- --ignored --nocapture
              uv_and_node_are_installed_into_the_state_directory

      - name: Smoke test the bootstrap CLI
        working-directory: apps/updater
        shell: bash
        run: |
          # It reports a version and refuses nonsense. Both are things a user
          # hits before anything else, and neither needs a window.
          cargo run -q -p marvi-bootstrap -- --version
          cargo run -q -p marvi-bootstrap -- nonsense && exit 1 || true

      - name: Build the app exactly as the updater will
        shell: bash
        env:
          MARVI_BUILD_COMMIT: ${{ github.sha }}
          MARVI_BUILD_TIME: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || '' }}
        run: npm run build:unpack

      - name: Smoke test the build output
        shell: bash
        run: |
          # The same check the updater makes before swapping a build into place.
          test -f apps/desktop/out/main/index.js || {
            echo "::error::build:unpack produced no Electron entrypoint"
            exit 1
          }

      # -- the artifact -------------------------------------------------------

      - name: Build Marvi Bootstrap (installer + updater)
        working-directory: apps/updater
        run: cargo build --release -p marvi-bootstrap

      - name: Checksums
        shell: bash
        run: |
          mkdir -p release
          cp apps/updater/target/release/marvi-bootstrap.exe release/
          cd release
          sha256sum marvi-bootstrap.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts (dry run only)
        if: steps.version.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marvi-bootstrap-${{ steps.version.outputs.version }}-win-x64
          path: release/*
          if-no-files-found: error

      - name: Generate release notes
        if: steps.version.outputs.dry_run == 'false'
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Marvi OS v${{ steps.version.outputs.version }}"
            echo
            echo "**Already have Marvi?** It updates itself — nothing here to download."
            echo
            echo "**New install:** download \`marvi-bootstrap.exe\` and run it. It"
            echo "installs \`uv\` and Node, clones this tag, and builds it."
            echo
            echo "### Changes"
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source archives GitHub attaches are the actual payload: the
          # updater clones the tag. The bootstrap is only for a first install.
          gh release create "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "Marvi OS v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            release/marvi-bootstrap.exe \
            release/SHA256SUMS.txt

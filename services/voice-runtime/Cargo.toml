[package]
name = "marvi-voice-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Thin native Windows bridge from LiveKit Agents to parakeet-rs"

[dependencies]
base64 = "0.22"
parakeet-rs = { version = "0.3.7", features = ["cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true


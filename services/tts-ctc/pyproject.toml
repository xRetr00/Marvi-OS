[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-tts-ctc"
version = "0.1.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "editdistance==0.8.1",
  "einops==0.8.2",
  "huggingface-hub==0.23.0",
  "librosa==0.11.0",
  "numpy==1.26.4",
  "omegaconf==2.0.6",
  "pyyaml==6.0.3",
  "sentencepiece==0.2.1",
  "scipy==1.13.1",
  "soundfile==0.13.1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  # Upstream pins 4.28.1, whose tokenizers wheel does not support Python 3.12.
  # CTC inference only uses the stable WavLM APIs available in this release.
  "transformers==4.40.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu118", marker = "sys_platform == 'win32'" }]

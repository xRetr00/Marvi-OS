[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-os-agent"
version = "0.1.0.dev0"
description = "LiveKit Agents worker for Marvi OS"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "livekit-agents[openai]>=1.6.9,<2",
    "livekit-plugins-silero>=1.6.9,<2",
    "livekit-wakeword>=0.2",
    "numpy>=2,<3",
    "python-dotenv>=1,<2",
    # The speech engine. 82M against VibeVoice's 0.5B, and on this card it
    # measured 34.7x real time against 1.17x -- the margin is the point, not
    # the speed: 1.17x has none left once the recogniser wants the GPU too.
    "kokoro>=0.9,<1",
    # Parakeet TDT, fed in chunks. Measured on 54 clips of non-native
    # English it makes 13.7% word errors against the previous engine's
    # 22.0%, and it runs on ONNX Runtime with no PyTorch or NeMo of its
    # own -- so it can be pointed at the CPU and leave the card to Kokoro.
    #
    # Pinned to a commit rather than a range: it is a young project, and
    # whether Marvi can hear now depends on it.
    "parakeet-streaming-onnx @ git+https://github.com/dhyuk54/parakeet-streaming-onnx@0fe7d2469be17506eba827507d69208f42e2149f",
    "onnxruntime-gpu>=1.29,<2",
    "onnx-asr>=0.7,<1",
    # Kokoro's grapheme-to-phoneme needs this spaCy model, and
    # `spacy download` reports success while installing nothing a uv
    # environment can see. Named as a dependency so it is actually there.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # The wake word listener holds the microphone directly. It runs before
    # LiveKit exists, so it cannot borrow the room's audio the way the
    # in-session detector did.
    "sounddevice>=0.5,<1",
    "torch==2.13.0",
    "transformers==5.10.1",
    "vibevoice @ git+https://github.com/microsoft/VibeVoice.git@94da20d98b2fa7688e9cbfaf7692ddb4954f7600",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-os-agent"
version = "0.1.0.dev0"
description = "LiveKit Agents worker for Marvi OS"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "livekit-agents[openai]>=1.6.9,<2",
    "livekit-plugins-silero>=1.6.9,<2",
    "livekit-wakeword>=0.2",
    "numpy>=2,<3",
    "python-dotenv>=1,<2",
    # The wake word listener holds the microphone directly. It runs before
    # LiveKit exists, so it cannot borrow the room's audio the way the
    # in-session detector did.
    "sounddevice>=0.5,<1",
    "torch==2.13.0",
    "transformers==4.51.3",
    "vibevoice @ git+https://github.com/microsoft/VibeVoice.git@94da20d98b2fa7688e9cbfaf7692ddb4954f7600",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

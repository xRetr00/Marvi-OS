[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-tts-cute"
version = "0.1.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cutetts @ git+https://github.com/OPPO-Mente-Lab/CuteTTS.git@ca9dbd3b82c05f5b067466088449b93ee2aa5a0c",
  "huggingface-hub>=0.30,<1",
  "numpy>=1.26,<3",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[project.scripts]
marvi-tts-cute = "marvi_tts_cute.host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]

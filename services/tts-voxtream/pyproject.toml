[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-tts-voxtream"
version = "0.1.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "voxtream @ git+https://github.com/herimor/voxtream.git@8ec2d62159dae4716ae7058827244a962d40603c",
  "huggingface-hub==0.28.1",
  "numpy==1.26.4",
  "pyarrow==14.0.2",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu121", marker = "sys_platform == 'win32'" }]

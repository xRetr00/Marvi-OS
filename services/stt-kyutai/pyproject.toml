[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-stt-kyutai"
version = "0.1.0.dev0"
requires-python = ">=3.12,<3.13"
# Isolated for the same reason CuteTTS and VoXtream are, and the reason is
# measurable rather than cautious. Resolving `moshi` into the agent's
# environment would have done this:
#
#     - torch 2.13.0+cu130   ->  + torch 2.9.1        (a CPU wheel)
#     - numpy 2.5.2          ->  + numpy 2.2.6
#     - safetensors 0.8.0    ->  + safetensors 0.7.0
#     - sounddevice 0.5.6    ->  + sounddevice 0.5.0
#
# A CPU torch takes Kokoro's speech synthesis and every CUDA path in the agent
# with it. So the recogniser lives here, in its own environment, and only PCM
# and text cross the boundary.
dependencies = [
  "moshi==0.2.13",
  "huggingface-hub>=0.30,<1",
  "numpy>=1.26,<3",
  "sphn>=0.2,<1",
  "torch==2.9.1",
]

[project.scripts]
marvi-stt-kyutai = "marvi_stt_kyutai.host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-os-gateway"
version = "0.1.0.dev0"
description = "Local lifecycle and status facade for Marvi OS"
requires-python = ">=3.12,<3.15"
dependencies = [
    "composio>=0.19,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "playwright>=1.49,<2",
    "livekit-api>=1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: exercises a real Chromium instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

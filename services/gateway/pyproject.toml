[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvi-os-gateway"
version = "0.1.0.dev0"
description = "Local lifecycle and status facade for Marvi OS"
requires-python = ">=3.12,<3.15"
dependencies = [
    "composio>=0.19,<1",
    "pocket-tts>=2,<3",
    # One-shot announcements and Chat Read Aloud play directly to the selected
    # Windows endpoint. The full-duplex LiveKit session remains separate.
    "sounddevice>=0.5,<1",
    "mcp>=1.9,<2",
    "apscheduler>=3.10,<4",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    # `marvi setup` renders its screen with this. Already present
    # transitively; declared because depending on somebody else's
    # dependency is how a working install breaks on an unrelated bump.
    "rich>=13,<15",
    "playwright>=1.49,<2",
    "livekit-api>=1,<2",
    "markitdown[pdf,docx,xlsx,pptx]>=0.1.7,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
# The terminal front end over the same modules the Gateway serves. One line,
# because the CLI is a caller rather than a second implementation.
marvi = "marvi_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: exercises a real Chromium instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

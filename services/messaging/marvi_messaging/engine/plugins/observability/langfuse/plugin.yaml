name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Marvi — traces conversations, LLM calls, and tool usage. Opt-in via `marvi plugins enable observability/langfuse` or `marvi tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - MARVI_MESSAGING_LANGFUSE_PUBLIC_KEY
  - MARVI_MESSAGING_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop

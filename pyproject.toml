[tool.uv.workspace]
members = ["services/agent", "services/gateway"]
exclude = ["services/messaging/marvi_messaging/engine"]

[tool.uv]
constraint-dependencies = ["yarl<1.24"]
# Kokoro's grapheme-to-phoneme pulls `misaki[en]`, which drags in spaCy's
# curated-transformers stack. Its native extension has no wheel past CPython
# 3.12 and needs a C compiler to build, which a Windows install does not have.
# Kokoro only reaches for it under `trf=True`, and Marvi runs the default
# `trf=False` path, so the requirement is overridden with a marker that can
# never match. Here rather than in the Agent because uv reads overrides from
# the workspace root and silently ignores them in a member.
override-dependencies = [
    "spacy-curated-transformers ; sys_platform == 'no-such-platform'",
    "curated-tokenizers ; sys_platform == 'no-such-platform'",
    # `onnxruntime` and `onnxruntime-gpu` install the same `onnxruntime` module
    # over each other. Four packages here ask for the plain one and the speech
    # recogniser needs the CUDA providers, so both landed -- and the result was
    # not an import error but wrong transcripts: "when you were a kid, what
    # kinds of games" came back as "no however can look the chest".
    #
    # The GPU build is a superset and serves the CPU provider too, so the plain
    # requirement is overridden away and everyone gets the one package.
    "onnxruntime ; sys_platform == 'no-such-platform'",
]

[package]
name = "marvi-pet-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Focused native Windows renderer for the Marvi OS desktop pet"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

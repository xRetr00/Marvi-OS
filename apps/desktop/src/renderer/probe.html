<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Marvi probe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      window.__errs = []
      window.addEventListener('error', (e) => {
        window.__errs.push(String(e.error && e.error.stack ? e.error.stack : e.message))
      })
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('REJECT ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason))
      })

      // TEMP: a preload bridge that answers everything with benign data, so
      // the renderer can be inspected outside Electron.
      const thread = {
        id: 'default', title: 'New conversation', message_count: 0,
        updated_at: new Date().toISOString(), created_at: new Date().toISOString(),
        archived: false, active_message_id: null, active_branch: 'main',
        selected_provider: '', selected_model: '', selected_effort: ''
      }
      const runtime = {
        state: 'ready',
        components: { gateway: { state: 'ready', detail: 'ok' } },
        model: { llm: 'test-model', stt: '', tts: '' },
        assistant: { phase: 'idle', question: null, secret: null, caption: '' },
        confirmation: null, announcement: null, listening: false, speaking: false
      }
      const shapes = {
        getChat: { messages: [], available: true, threads: [thread], active_thread: 'default', context: null },
        getChatThreads: [],
        getRuntime: runtime,
        getModels: { providers: [] },
        getProviders: { selected: '', providers: [] },
        getAsking: { waiting: [] },
        getUsage: { tokens: { billable: 0, cached_input: 0, input: 0, output: 0 }, billable: 0, sessions: [], days: [] },
        getSessionUsage: { tokens: { billable: 0, cached_input: 0 } },
        getActivity: { events: [] },
        getEvents: { events: [] }
      }
      window.marvi = new Proxy({}, {
        get(_t, key) {
          const k = String(key)
          if (k.startsWith('on')) return () => () => {}
          if (k === 'then') return undefined
          return async () => {
            if (k in shapes) return shapes[k]
            // Unknown calls answer with something that survives both
            // `for (const x of r.events)` and `r.foo.bar` probing.
            return new Proxy({ events: [], items: [], entries: [], waiting: [] }, {
              get(t, prop) {
                if (prop in t) return t[prop]
                if (prop === Symbol.iterator) return undefined
                return {}
              }
            })
          }
        }
      })
      await import(new URLSearchParams(location.search).get('shell') ? '/src/main.tsx' : '/src/probe-main.tsx')
    </script>
  </body>
</html>

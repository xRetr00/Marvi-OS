<!doctype html>
<html><head><meta charset="UTF-8" /><title>probe</title>
<style>html,body,#root{height:100%;margin:0}#root{display:flex}
#root>main.content{flex:1;min-width:0;display:flex;flex-direction:column}</style></head>
<body><div id="root"></div>
<script type="module">
  const now = new Date().toISOString()
  const th = { id:'t1', title:'Tools', message_count:2, updated_at:now, created_at:now,
    archived:false, active_message_id:2, active_branch:'main',
    selected_provider:'', selected_model:'', selected_effort:'' }
  const done = (n, c) => ({ type:'tool', name:n, content:c })
  const messages = [
    { id:1, at:now, role:'user', content:'Check the logs and fix it', meta:{}, thread_id:'t1',
      parent_id:null, branch_id:'main', parts:[{type:'text',text:'Check the logs and fix it'}], attachments:[] },
    { id:2, at:now, role:'assistant', content:'', meta:{provider:'openai', streaming:true},
      thread_id:'t1', parent_id:1, branch_id:'main',
      parts:[
        done('marvi_logs','ok'), done('file_read','ok'), done('web_search','ok'),
        done('file_edit','ok'), done('memory_recall','ok'), done('computer_action','ok'),
        done('browser_open','ok'), done('terminal_run','ok'), done('acme_widgetise','ok'),
        { type:'tool', name:'file_write', status:'running' }
      ], attachments:[] }
  ]
  const shapes = { getChat:{ messages, available:true, threads:[th], active_thread:'t1', context:null },
    getChatThreads:[], getModels:{providers:[]}, getProviders:{selected:'',providers:[]} }
  window.marvi = new Proxy({}, { get(_t,k){ const n=String(k)
    if (n.startsWith('on')) return () => () => {}
    if (n === 'then') return undefined
    return async () => (n in shapes ? shapes[n] : {}) } })
  await import('/src/probe-main.tsx')
</script></body></html>

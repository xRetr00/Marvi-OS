<body><div id="root"></div>
<script type="module">
  const now = new Date().toISOString()
  const th = { id:'t1', title:'Room status', message_count:2, updated_at:now, created_at:now,
    archived:false, active_message_id:2, active_branch:'main',
    selected_provider:'', selected_model:'', selected_effort:'' }
  const think = 'Checking the logs for the bulb circuit breaker and the missing cv2 module.'
  const messages = [
    { id:1, at:now, role:'user', content:"Hi Marvi What's The Room Status", meta:{}, thread_id:'t1',
      parent_id:null, branch_id:'main', parts:[{type:'text',text:"Hi Marvi What's The Room Status"}], attachments:[] },
    { id:2, at:now, role:'assistant', content:'', meta:{provider:'openai', streaming:true, reasoning: think, tool:'marvi_logs'},
      thread_id:'t1', parent_id:1, branch_id:'main',
      parts:[{type:'tool', name:'marvi_logs', status:'running'}], attachments:[] }
  ]
  const shapes = { getChat:{ messages, available:true, threads:[th], active_thread:'t1', context:null },
    getChatThreads:[], getModels:{providers:[]}, getProviders:{selected:'',providers:[]} }
  window.marvi = new Proxy({}, { get(_t,k){ const n=String(k)
    if (n.startsWith('on')) return () => () => {}
    if (n === 'then') return undefined
    return async () => (n in shapes ? shapes[n] : {}) } })
  await import('/src/probe-main.tsx')
</script></body></html>

<!doctype html>
<html><head><meta charset="UTF-8" /><title>Marvi probe</title>
<style>html,body,#root{height:100%;margin:0}#root{display:flex}#root>main.content{flex:1;min-width:0;display:flex;flex-direction:column}</style></head>
<body><div id="root"></div>
<script type="module">
  const now = new Date().toISOString()
  const thread = { id:'default', title:'Hi', message_count:2, updated_at:now, created_at:now,
    archived:false, active_message_id:2, active_branch:'main',
    selected_provider:'', selected_model:'', selected_effort:'' }
  const messages = [
    { id:1, at:now, role:'user', content:'Hi', meta:{}, thread_id:'default', parent_id:null,
      branch_id:'main', parts:[{type:'text',text:'Hi'}], attachments:[] },
    { id:2, at:now, role:'assistant', content:'Hey Shereef.', meta:{provider:'openai',model:'gpt'},
      thread_id:'default', parent_id:1, branch_id:'main',
      parts:[{type:'text',text:'Hey Shereef.'}], attachments:[] }
  ]
  const shapes = {
    getChat:{ messages: new URLSearchParams(location.search).get('empty') ? [] : messages, available:true, threads:[thread], active_thread:'default', context:null },
    getChatThreads:[], getModels:{providers:[]}, getProviders:{selected:'',providers:[]}
  }
  window.marvi = new Proxy({}, { get(_t,k){ const n=String(k)
    if (n.startsWith('on')) return () => () => {}
    if (n === 'then') return undefined
    return async () => (n in shapes ? shapes[n] : {}) } })
  await import('/src/probe-main.tsx')
</script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marvi Bootstrap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <div class="panel-label">// MARVI BOOTSTRAP</div>

        <span>installer / updater</span>
        <span class="accent" id="channel"></span>
      </footer>
    </main>
    <script src="main.js"></script>
  </body>
</html>

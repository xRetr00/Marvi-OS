<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marvi Bootstrap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <div class="panel-label">// MARVI BOOTSTRAP</div>
      <h1 id="title">PREPARING</h1>
      <div class="stage" id="stage">
        <span class="spinner" id="spinner"></span>
        <span id="stage-text">starting&hellip;</span>
      </div>

      <!-- Real, not decorative: each step of the bar is a step that actually
           ran. See MILESTONES in app.rs. -->
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar">
        <div class="bar-fill" id="bar-fill"></div>
      </div>

      <!-- The install takes fifteen minutes. Without this the window shows one
           line the whole time, which is indistinguishable from a hang. -->
      <pre class="log" id="log" aria-live="polite"></pre>

      <!-- Shown only when there is a real choice to make. Getting it wrong
           means a multi-gigabyte reinstall, so it is asked, not guessed. -->
      <div class="ask" id="gpu-ask" hidden>
        <p id="gpu-prompt"></p>
        <div class="ask-buttons">
          <button type="button" id="gpu-yes" class="primary">Use the GPU</button>
          <button type="button" id="gpu-no">CPU only</button>
        </div>
      </div>

      <div class="status" id="status" hidden></div>

      <!-- The window used to close itself 1.5s after finishing, which made a
           failed install look the same as a successful one. It waits now. -->
      <div class="ask-buttons" id="close-row" hidden>
        <button type="button" id="close" class="primary">Close</button>
      </div>
      <footer>
        <span>installer / updater</span>
        <span class="accent" id="channel"></span>
      </footer>
    </main>
    <script src="main.js"></script>
  </body>
</html>

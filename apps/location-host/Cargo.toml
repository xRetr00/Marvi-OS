[package]
name = "marvi-location-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-shot Windows geolocation adapter supervised by Electron"

[dependencies]
serde_json = "1"
windows = { version = "=0.62.2", features = ["Devices_Geolocation", "Foundation", "Security_Authorization_AppCapabilityAccess", "Win32_System_WinRT"] }

[profile.release]
strip = true
opt-level = "s"
